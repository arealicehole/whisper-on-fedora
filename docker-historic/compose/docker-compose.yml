version: '3.8'

services:
  whisper-api:
    build: .
    image: whisper-diarize:latest
    container_name: whisper-api
    ports:
      - "8765:8765"
    volumes:
      # Mount token file
      - ~/.config/whisper/token:/root/.config/whisper/token:ro
      # Mount for audio files (optional)
      - ./audio:/app/audio
    environment:
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
      - WHISPER_DIARIZE=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped