version: '3.8'

services:
  whisper-blackwell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.blackwell.working
    image: whisper-api:blackwell
    container_name: whisper-blackwell
    
    # Enable GPU support
    runtime: nvidia
    
    # Additional settings for better CUDA support
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    shm_size: '16gb'
    
    environment:
      # GPU configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      
      # Whisper configuration
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
      - WHISPER_DIARIZE=${WHISPER_DIARIZE:-true}
      - WHISPER_DEFAULT_FORMAT=${WHISPER_DEFAULT_FORMAT:-json}
      
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8765
    
    volumes:
      # CRITICAL: Reuse existing model caches to avoid re-downloading
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/whisper:/root/.cache/whisper
      
      # Mount config directory with HuggingFace token
      - ~/.config/whisper:/root/.config/whisper:ro
      
      # Audio files directory for processing
      - ./audio_files:/app/audio_files
      
      # Optional: Mount entire project for development
      # - ..:/app:ro
    
    ports:
      - "8765:8765"
    
    restart: unless-stopped
    
    # GPU resource reservation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network mode for better performance
    network_mode: bridge
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Optional: Create a named volume for models if you prefer
volumes:
  whisper-models:
    driver: local
  huggingface-cache:
    driver: local

# Network definition (optional, uses default bridge)
networks:
  default:
    driver: bridge