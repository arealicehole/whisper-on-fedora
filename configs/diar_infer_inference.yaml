# Complete NeMo Diarization Config for Blackwell GPU
device: cuda  # CRITICAL - must be at root level

diarizer:
  manifest_filepath: null
  out_dir: ./nemo_outputs
  oracle_vad: False
  collar: 0.25
  ignore_overlap: True
  
  vad:
    model_path: vad_multilingual_marblenet
    external_vad_manifest: null
    parameters:
      window_length_in_sec: 0.63
      shift_length_in_sec: 0.01
      smoothing: "median"
      overlap: 0.5
      onset: 0.9
      offset: 0.5
      min_duration_on: 0.1
      min_duration_off: 0.6
      filter_speech_first: True
      
  speaker_embeddings:
    model_path: titanet_large
    parameters:
      window_length_in_sec: [1.5, 1.25, 1.0, 0.75, 0.5]
      shift_length_in_sec: [0.75, 0.625, 0.5, 0.375, 0.25]
      multiscale_weights: [1, 1, 1, 1, 1]
      save_embeddings: False
      batch_size: 32
      
  clustering:
    parameters:
      oracle_num_speakers: False
      max_num_speakers: 8
      enhanced_count_thres: 80
      max_rp_threshold: 0.25
      sparse_search_volume: 30
      maj_vote_spk_count: False

# Add num_workers at root level
num_workers: 1
